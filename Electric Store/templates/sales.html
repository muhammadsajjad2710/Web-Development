{% extends "base.html" %}
{% block title %}Sales - Electric Store{% endblock %}
{% block content %}
<div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-2">
  <div>
    <h2><i class="bi bi-cart-check"></i> Sales</h2>
    <p class="text-muted mb-0">Cash & installment sales with invoice</p>
  </div>
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#saleModal">
    <i class="bi bi-plus-lg"></i> New Sale
  </button>
</div>

<div class="card shadow-sm">
  <div class="card-body table-responsive">
    <table class="table table-hover" id="salesTable">
      <thead class="table-light">
        <tr>
          <th>Invoice</th>
          <th>Date</th>
          <th>Product</th>
          <th>Customer</th>
          <th>Type</th>
          <th>Total</th>
          <th>Remaining</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="saleModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form id="saleForm">
        <div class="modal-header">
          <h5 class="modal-title">New Sale</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Product</label>
              <select class="form-select" id="saleProduct" required></select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Customer</label>
              <select class="form-select" id="saleCustomer">
                <option value="">Walk-in Customer</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div class="col-md-4 mb-3">
              <label class="form-label">Sale Type</label>
              <select class="form-select" id="saleType">
                <option value="cash">Cash Sale</option>
                <option value="installment">Installment Sale</option>
              </select>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Quantity</label>
              <input type="number" class="form-control" id="saleQty" min="1" value="1">
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Unit Price (auto)</label>
              <input type="text" class="form-control" id="saleUnitPrice" readonly>
            </div>
          </div>
          <div id="installmentFields" class="d-none">
            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label">Down Payment</label>
                <input type="number" class="form-control" id="saleDown" min="0" value="0">
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">Installment Months</label>
                <input type="number" class="form-control" id="saleMonths" min="1" value="12">
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">Monthly (est.)</label>
                <input type="text" class="form-control" id="saleMonthly" readonly>
              </div>
            </div>
          </div>
          <div class="alert alert-light border">
            <strong>Total: </strong><span id="saleTotal">Rs. 0</span>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Sale</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script src="/static/js/sales.js"></script>
{% endblock %}
