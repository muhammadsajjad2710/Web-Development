{% extends "base.html" %}
{% block title %}Expenses - Electric Store{% endblock %}
{% block content %}
<div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-2">
  <div>
    <h2><i class="bi bi-wallet2"></i> Expenses</h2>
    <p class="text-muted mb-0">Track rent, bills, salaries & repairs</p>
  </div>
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#expenseModal">
    <i class="bi bi-plus-lg"></i> Add Expense
  </button>
</div>

<div class="card shadow-sm">
  <div class="card-body table-responsive">
    <table class="table table-hover" id="expensesTable">
      <thead class="table-light">
        <tr>
          <th>Date</th>
          <th>Category</th>
          <th>Description</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="expenseModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="expenseForm">
        <div class="modal-header">
          <h5 class="modal-title">Add Expense</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Category</label>
            <select class="form-select" id="expenseCategory" required>
              <option value="Rent">Rent</option>
              <option value="Bills">Bills</option>
              <option value="Salaries">Salaries</option>
              <option value="Repairs">Repairs</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <input type="text" class="form-control" id="expenseDesc">
          </div>
          <div class="mb-3">
            <label class="form-label">Amount (Rs.)</label>
            <input type="number" class="form-control" id="expenseAmount" min="0" step="0.01" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Date</label>
            <input type="date" class="form-control" id="expenseDate">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script src="/static/js/expenses.js"></script>
{% endblock %}
