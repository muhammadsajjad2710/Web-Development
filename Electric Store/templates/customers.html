{% extends "base.html" %}
{% block title %}Customers - Electric Store{% endblock %}
{% block content %}
<div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-2">
  <div>
    <h2><i class="bi bi-people"></i> Customers</h2>
    <p class="text-muted mb-0">Customer records for sales & installments</p>
  </div>
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#customerModal">
    <i class="bi bi-person-plus"></i> Add Customer
  </button>
</div>

<div class="card shadow-sm">
  <div class="card-body table-responsive">
    <table class="table table-hover" id="customersTable">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th>Phone</th>
          <th>CNIC</th>
          <th>Address</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="customerModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="customerForm">
        <div class="modal-header">
          <h5 class="modal-title">Add Customer</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" id="customerName" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" class="form-control" id="customerPhone" required>
          </div>
          <div class="mb-3">
            <label class="form-label">CNIC</label>
            <input type="text" class="form-control" id="customerCnic">
          </div>
          <div class="mb-3">
            <label class="form-label">Address</label>
            <textarea class="form-control" id="customerAddress" rows="2"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script src="/static/js/customers.js"></script>
{% endblock %}
