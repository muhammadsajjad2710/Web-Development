<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Electric Store{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="d-flex" id="wrapper">
    <nav id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <i class="bi bi-lightning-charge-fill"></i>
        <span>Electric Store</span>
      </div>
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link {% if page == 'dashboard' %}active{% endif %}" href="/dashboard">
            <i class="bi bi-speedometer2"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if page == 'products' %}active{% endif %}" href="/products">
            <i class="bi bi-box-seam"></i> Products
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if page == 'customers' %}active{% endif %}" href="/customers">
            <i class="bi bi-people"></i> Customers
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if page == 'sales' %}active{% endif %}" href="/sales">
            <i class="bi bi-cart-check"></i> Sales
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if page == 'installments' %}active{% endif %}" href="/installments">
            <i class="bi bi-calendar2-check"></i> Installments
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if page == 'expenses' %}active{% endif %}" href="/expenses">
            <i class="bi bi-wallet2"></i> Expenses
          </a>
        </li>
      </ul>
      <div class="sidebar-footer">
        <button class="btn btn-outline-light btn-sm w-100" id="logoutBtn">
          <i class="bi bi-box-arrow-right"></i> Logout
        </button>
      </div>
    </nav>

    <div id="page-content">
      <header class="topbar">
        <button class="btn btn-link d-lg-none" id="sidebarToggle"><i class="bi bi-list fs-4"></i></button>
        <div class="ms-auto d-flex align-items-center gap-2">
          <span class="text-muted small">Welcome,</span>
          <strong id="adminName">Admin</strong>
        </div>
      </header>
      <main class="container-fluid py-4">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
