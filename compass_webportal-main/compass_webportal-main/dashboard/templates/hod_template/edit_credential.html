{% extends 'hod_template/base_template.html' %}

{% block page_title %}
    Edit Credentials
{% endblock page_title %}

{% block main_content %}
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Edit Credentials</h3>
                    </div>
                    <div class="card-body">
                        <form method="post" action="{% url 'edit_credential' credential.id %}">
                            {% csrf_token %}
                            <div class="form-group">
                                <label for="compass_username">Compass Username:</label>
                                <input type="text" name="compass_username" id="compass_username" class="form-control" value="{{ credential.compass_username }}" required>
                            </div>
                            <div class="form-group">
                                <label for="compass_password">Compass Password:</label>
                                <input type="password" name="compass_password" id="compass_password" class="form-control" value="{{ credential.compass_password }}" required>
                            </div>
                            <div class="form-group">
                                <label for="compass_memorableword">Compass Memorable Word:</label>
                                <input type="password" name="compass_memorableword" id="compass_memorableword" class="form-control" value="{{ credential.compass_memorableword}}" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Update Credentials</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock main_content %}
