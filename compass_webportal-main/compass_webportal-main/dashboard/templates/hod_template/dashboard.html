{% extends 'hod_template/base_template.html' %}

{% block page_title %}
    UDAs Details
{% endblock page_title %}

{% block main_content %}
    <label for="contractDropdown">Select Contract ID:</label>
    <select id="contractDropdown">
        {% for contract_id in contract_ids %}
            <option value="{{ contract_id }}">{{ contract_id }}</option>
        {% endfor %}
    </select>

    <canvas id="udaChart" width="800" height="400"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>

    <script>
        // Initialize the chart
        var ctx = document.getElementById('udaChart').getContext('2d');
        var udaChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: {{ labels|safe }},
                datasets: [
                    {
                        label: 'Predicted',
                        data: {{ predicted_data|safe }},
                        backgroundColor: 'rgba(173, 216, 230, 0.5)',
                        borderColor: 'rgba(173, 216, 230, 1)',
                        borderWidth: 1,
                        fill: true,
                        stepped: true
                    },
                    {
                        label: 'Target',
                        data: {{ target_data|safe }},
                        borderColor: 'rgba(255, 0, 0, 1)',
                        borderWidth: 2,
                        fill: false,
                        type: 'line'
                    }
                ]
            },
            options: {
                scales: {
                    x: {
                        beginAtZero: true
                    },
                    y: {
                        beginAtZero: true
                    }
                },
                plugins: {
                    legend: {
                        position: 'right'
                    },
                    annotation: {
                        annotations: {
                            todayLine: {
                                type: 'line',
                                mode: 'vertical',
                                scaleID: 'x',
                                value: {{ today_index }},
                                borderColor: 'rgba(255, 165, 0, 1)',
                                borderWidth: 2,
                                borderDash: [5, 5],
                                label: {
                                    enabled: true,
                                    content: 'Today',
                                    position: 'start'
                                }
                            }
                        }
                    }
                }
            }
        });
    
        // Function to update the chart based on selected contract
        function updateChart(contract_id) {
            fetch("", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ contract_id: contract_id })
            })
            .then(response => response.json())
            .then(data => {
                // Update the chart with new data
                udaChart.data.datasets[0].data = data.predicted_data;
                udaChart.data.datasets[1].data = data.target_data;
                udaChart.update();
            })
            .catch(error => console.error('Error:', error));
        }
    
        // Event listener for the contract dropdown
        document.getElementById('contractDropdown').addEventListener('change', function() {
            var selectedContractId = this.value;
            updateChart(selectedContractId);
        });
    
        // Initial plot update for default contract selection
        document.addEventListener('DOMContentLoaded', function() {
            var initialContractId = document.getElementById('contractDropdown').value;
            if (initialContractId) {
                updateChart(initialContractId);
            }
        });
    </script>
    
{% endblock main_content %}
