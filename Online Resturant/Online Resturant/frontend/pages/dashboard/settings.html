<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — Online Restaurant</title>
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <link rel="stylesheet" href="../../assets/css/dashboard.css" />
</head>
<body>
  <div id="app"></div>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/dashboard.js"></script>
  <script>
    (async function () {
      const content = ORDashboard.renderShell({ title: "Settings" });
      if (!content) return;
      try {
        const r = await ORApi.get("/restaurants/me");
        content.innerHTML = `
          <section class="card">
            <div class="card-header"><strong>Restaurant profile</strong></div>
            <div class="card-body">
              <form id="settings-form">
                <div class="form-group">
                  <label class="form-label">Name</label>
                  <input class="form-control" id="name" value="${r.name || ""}" />
                </div>
                <div class="form-group">
                  <label class="form-label">Description</label>
                  <textarea class="form-control" id="description" rows="3">${r.description || ""}</textarea>
                </div>
                <div class="form-group">
                  <label class="form-label">WhatsApp number</label>
                  <input class="form-control" id="whatsapp_number" value="${r.whatsapp_number || ""}" />
                </div>
                <div class="form-group">
                  <label class="form-label">Tax rate (%)</label>
                  <input class="form-control" id="tax_rate" type="number" step="0.01" value="${r.tax_rate}" />
                </div>
                <div class="form-group">
                  <label class="form-label">Currency</label>
                  <input class="form-control" id="currency" value="${r.currency}" />
                </div>
                <p class="muted">Public URL slug: <strong>/r/${r.slug}</strong></p>
                <button class="btn btn-primary" type="submit">Save changes</button>
              </form>
            </div>
          </section>
        `;
        document.getElementById("settings-form").addEventListener("submit", async (e) => {
          e.preventDefault();
          try {
            await ORApi.patch("/restaurants/me", {
              name: document.getElementById("name").value.trim(),
              description: document.getElementById("description").value.trim(),
              whatsapp_number: document.getElementById("whatsapp_number").value.trim(),
              tax_rate: Number(document.getElementById("tax_rate").value),
              currency: document.getElementById("currency").value.trim(),
            });
            ORUI.toast("Settings saved", "success");
          } catch (err) {
            ORUI.toast(err.message, "error");
          }
        });
      } catch (err) {
        content.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    })();
  </script>
</body>
</html>
