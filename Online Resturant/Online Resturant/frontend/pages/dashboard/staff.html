<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff — Online Restaurant</title>
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <link rel="stylesheet" href="../../assets/css/dashboard.css" />
</head>
<body>
  <div id="app"></div>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/dashboard.js"></script>
  <script>
    const content = ORDashboard.renderShell({ title: "Staff" });
    if (content) {
      const user = ORApi.getUser();
      content.innerHTML = `
        <section class="card">
          <div class="card-header"><strong>Team & roles</strong></div>
          <div class="card-body">
            <div class="alert alert-info">Staff invite API is scaffolded. Current signed-in account:</div>
            <table class="data">
              <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr></thead>
              <tbody>
                <tr>
                  <td>${user.full_name}</td>
                  <td>${user.email}</td>
                  <td>${user.role?.display_name || user.role?.name}</td>
                  <td>${ORUI.statusBadge("active")}</td>
                </tr>
              </tbody>
            </table>
            <p class="muted mt-2">Supported roles: Owner, Branch Manager, Kitchen, Order Staff, Delivery, Marketing.</p>
          </div>
        </section>
      `;
    }
  </script>
</body>
</html>
