<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Branches — Online Restaurant</title>
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <link rel="stylesheet" href="../../assets/css/dashboard.css" />
</head>
<body>
  <div id="app"></div>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/dashboard.js"></script>
  <script>
    (async function () {
      const content = ORDashboard.renderShell({ title: "Branches" });
      if (!content) return;
      try {
        const branches = await ORApi.get("/branches");
        content.innerHTML = `
          <section class="card">
            <div class="card-header"><strong>Branch locations</strong></div>
            <div class="card-body" style="padding:0;">
              <table class="data">
                <thead><tr><th>Name</th><th>City</th><th>Contact</th><th>Radius</th><th>Status</th></tr></thead>
                <tbody>
                  ${branches
                    .map(
                      (b) => `<tr>
                      <td><strong>${b.name}</strong>${b.is_default ? ' <span class="badge badge-confirmed">Default</span>' : ""}<div class="muted" style="font-size:.8rem;">${b.address || ""}</div></td>
                      <td>${b.city || "—"}</td>
                      <td>${b.contact_number || "—"}</td>
                      <td>${b.delivery_radius_km} km</td>
                      <td>${ORUI.statusBadge(b.status)}</td>
                    </tr>`
                    )
                    .join("")}
                </tbody>
              </table>
            </div>
          </section>
        `;
      } catch (err) {
        content.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    })();
  </script>
</body>
</html>
