<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot password — Online Restaurant</title>
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <link rel="stylesheet" href="../../assets/css/auth.css" />
</head>
<body>
  <div class="auth-page">
    <aside class="auth-visual">
      <a class="brand" href="../../index.html" style="color:#fff;">
        <span class="brand-mark">OR</span>
        Online Restaurant
      </a>
      <div>
        <h1>Reset access securely</h1>
        <p>Password reset tokens are generated server-side. Email delivery can be wired to your provider later.</p>
      </div>
      <p style="position:relative;z-index:1;opacity:.7;font-size:.85rem;">MSA Technologies</p>
    </aside>
    <main class="auth-panel">
      <div class="auth-card">
        <h2>Forgot password</h2>
        <p class="subtitle">We'll send reset instructions if the account exists</p>
        <div id="alert" class="alert alert-info hidden"></div>
        <form id="forgot-form">
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" type="email" required />
          </div>
          <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Send reset link</button>
        </form>
        <div class="auth-footer"><a href="login.html">Back to sign in</a></div>
      </div>
    </main>
  </div>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script>
    document.getElementById("forgot-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const alertEl = document.getElementById("alert");
      const btn = document.getElementById("submit-btn");
      ORUI.setLoading(btn, true);
      try {
        const data = await ORApi.post("/auth/forgot-password", {
          email: document.getElementById("email").value.trim(),
        }, { skipAuth: true });
        alertEl.textContent = data.message || "If the email exists, a reset link has been sent.";
        alertEl.className = "alert alert-success";
        alertEl.classList.remove("hidden");
      } catch (err) {
        alertEl.textContent = err.message;
        alertEl.className = "alert alert-error";
        alertEl.classList.remove("hidden");
      } finally {
        ORUI.setLoading(btn, false);
      }
    });
  </script>
</body>
</html>
